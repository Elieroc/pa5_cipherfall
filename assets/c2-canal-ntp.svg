<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" width="100%" role="img"
       aria-labelledby="ntp-title ntp-desc" style="display:block;">
    <title id="ntp-title">Canal C2 NTP — flux beacon et dispatch de tâche</title>
    <desc id="ntp-desc">Diagramme de séquence : l'agent ClockVenom envoie un beacon NTP Mode-3 chiffré via NTS Cookie. Le serveur C2 répond en Mode-4 avec une tâche si disponible, ou vide sinon. Fallback TCP/443 si UDP/123 bloqué.</desc>

    <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="ntp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ntp-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
      <marker id="ntp-arr-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ══ ARROWS (before boxes) ══ -->

    <!-- 1: CLOCKVENOM → VPS  NTP Mode-3 beacon (async open) -->
    <line x1="160" y1="164" x2="572" y2="164"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr-open)"/>
    <!-- two-line label above arrow -->
    <rect x="284" y="140" width="152" height="18" rx="2" fill="#f5f5f5"/>
    <text x="360" y="150" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">NTP MODE-3 + NTS COOKIE</text>
    <text x="360" y="158" fill="#7a8399" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.04em">AES-GCM · zlib · JSON beacon</text>

    <!-- ALT fragment: y=188 to y=368 -->
    <rect x="100" y="188" width="560" height="180" rx="4"
          fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <!-- ALT tab -->
    <rect x="100" y="188" width="36" height="16" rx="2"
          fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <text x="118" y="200" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.12em">ALT</text>
    <!-- guard 1 -->
    <text x="148" y="213" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.04em">[tâche en attente]</text>

    <!-- 2: VPS → CLOCKVENOM  NTP Mode-4 + task (accent return dashed) -->
    <line x1="572" y1="240" x2="164" y2="240"
          stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr-acc)"/>
    <rect x="268" y="222" width="164" height="18" rx="2" fill="#f5f5f5"/>
    <text x="350" y="232" fill="#eb6c36" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">NTP MODE-4 + NTS COOKIE</text>
    <text x="350" y="240" fill="#eb6c36" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.04em">AES-GCM · JSON task</text>

    <!-- ALT divider -->
    <line x1="108" y1="280" x2="652" y2="280"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- guard 2 -->
    <text x="148" y="298" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.04em">[pas de tâche]</text>

    <!-- 3: VPS → CLOCKVENOM  NTP Mode-4 vide (return dashed muted) -->
    <line x1="572" y1="328" x2="164" y2="328"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr)"/>
    <rect x="304" y="314" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="352" y="323" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">NTP MODE-4 (vide)</text>

    <!-- OPT fragment: y=384 to y=476 -->
    <rect x="100" y="384" width="560" height="92" rx="4"
          fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <!-- OPT tab -->
    <rect x="100" y="384" width="36" height="16" rx="2"
          fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <text x="118" y="396" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.12em">OPT</text>
    <!-- guard -->
    <text x="148" y="408" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.04em">[UDP/123 bloqué → fallback TCP/443]</text>

    <!-- 4: CLOCKVENOM → VPS  TCP/443 fallback (async open dashed) -->
    <line x1="160" y1="440" x2="572" y2="440"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr-open)"/>
    <rect x="272" y="422" width="212" height="12" rx="2" fill="#f5f5f5"/>
    <text x="378" y="431" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">TCP/443 · même format · lon. préfixée</text>

    <!-- ══ LIFELINES ══ -->
    <line x1="160" y1="116" x2="160" y2="524"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="580" y1="116" x2="580" y2="524"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ══ ACTOR BOXES ══ -->

    <!-- VICTIME (ClockVenom): cx=160, x=76, w=168 -->
    <rect x="76" y="60" width="168" height="52" rx="6" fill="#f5f5f5"/>
    <rect x="76" y="60" width="168" height="52" rx="6"
          fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="84" y="68" width="44" height="12" rx="2"
          fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
    <text x="106" y="77" fill="rgba(45,49,66,0.60)" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.08em">AGENT</text>
    <text x="160" y="95" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist',sans-serif" text-anchor="middle">ClockVenom</text>
    <text x="160" y="107" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono',monospace" text-anchor="middle">clockvenom.py</text>

    <!-- VPS C2 (focal): cx=580, x=496, w=168 -->
    <rect x="496" y="60" width="168" height="52" rx="6" fill="#f5f5f5"/>
    <rect x="496" y="60" width="168" height="52" rx="6"
          fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="504" y="68" width="32" height="12" rx="2"
          fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="520" y="77" fill="rgba(235,108,54,0.80)" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.08em">VPS</text>
    <text x="580" y="95" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist',sans-serif" text-anchor="middle">VPS C2</text>
    <text x="580" y="107" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono',monospace" text-anchor="middle">ntp/server.py · UDP/123</text>

    <!-- ══ LEGEND ══ -->
    <line x1="28" y1="534" x2="732" y2="534"
          stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

    <!-- beacon async -->
    <line x1="48" y1="554" x2="72" y2="554"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr-open)"/>
    <text x="80" y="558" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">BEACON ASYNC</text>

    <!-- return accent -->
    <line x1="240" y1="554" x2="264" y2="554"
          stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr-acc)"/>
    <text x="272" y="558" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">TÂCHE DISPATCH</text>

    <!-- return muted -->
    <line x1="432" y1="554" x2="456" y2="554"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#ntp-arr)"/>
    <text x="464" y="558" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">RETOUR VIDE</text>
  </svg>