<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canal C2 — Cloudflare Worker</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', sans-serif;
      background: #f5f5f5;
      color: #2d3142;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 3rem 2rem;
    }
    .frame { max-width: 800px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #4f5d75; margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem; font-weight: 400;
      color: #2d3142; margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">CIPHERFALL C2 — SÉQUENCE</p>
  <h1>Canal Cloudflare Worker</h1>

  <svg viewBox="0 0 760 608" width="100%" role="img"
       aria-labelledby="cf-title cf-desc" style="display:block;">
    <title id="cf-title">Canal C2 Cloudflare Worker — flux de tâches</title>
    <desc id="cf-desc">Diagramme de séquence : l'opérateur envoie une tâche au serveur C2, qui la dépose dans Cloudflare KV via worker.js. L'agent NullRelay poll le Worker, exécute la commande, et renvoie le résultat.</desc>

    <defs>
      <marker id="cf-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="cf-arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
      <marker id="cf-arr-lnk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#2e5aa8"/>
      </marker>
      <marker id="cf-arr-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ══ ARROWS (drawn before boxes) ══ -->

    <!-- 1: OPÉRATEUR → SERVER.PY  POST task (sync) -->
    <line x1="100" y1="164" x2="276" y2="164"
          stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-arr)"/>
    <rect x="148" y="146" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="176" y="155" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">POST TASK</text>

    <!-- 2: SERVER.PY → WORKER.JS  PUT /task/{id} (link-blue) -->
    <line x1="284" y1="212" x2="460" y2="212"
          stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#cf-arr-lnk)"/>
    <rect x="330" y="194" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="368" y="203" fill="#2e5aa8" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">PUT /task/{id}</text>

    <!-- 3: NULLRELAY → WORKER.JS  GET /task (async poll) -->
    <line x1="656" y1="264" x2="464" y2="264"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#cf-arr-open)"/>
    <rect x="528" y="246" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="564" y="255" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">GET /task/{id}</text>

    <!-- 4: WORKER.JS → NULLRELAY  task payload (return dashed) -->
    <line x1="460" y1="308" x2="656" y2="308"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#cf-arr)"/>
    <rect x="524" y="290" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="562" y="299" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">task payload</text>

    <!-- 5: NULLRELAY → WORKER.JS  PUT /result (async) -->
    <line x1="656" y1="400" x2="464" y2="400"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#cf-arr-open)"/>
    <rect x="524" y="382" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="562" y="391" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">PUT /result</text>

    <!-- 6: WORKER.JS → SERVER.PY  result (return dashed) -->
    <line x1="460" y1="444" x2="284" y2="444"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#cf-arr)"/>
    <rect x="340" y="426" width="44" height="12" rx="2" fill="#f5f5f5"/>
    <text x="362" y="435" fill="#4f5d75" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">result</text>

    <!-- 7: SERVER.PY → OPÉRATEUR  output (accent, headline) -->
    <line x1="276" y1="488" x2="100" y2="488"
          stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3"
          marker-end="url(#cf-arr-acc)"/>
    <rect x="148" y="470" width="44" height="12" rx="2" fill="#f5f5f5"/>
    <text x="170" y="479" fill="#eb6c36" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.06em">output</text>

    <!-- ══ LIFELINES ══ -->
    <line x1="100" y1="116" x2="100" y2="548"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="280" y1="116" x2="280" y2="548"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="460" y1="116" x2="460" y2="548"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="660" y1="116" x2="660" y2="548"
          stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <!-- SERVER.PY active: y=164 → y=496 -->
    <rect x="276" y="164" width="8" height="332"
          fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <!-- NULLRELAY active: y=308 → y=408 -->
    <rect x="656" y="308" width="8" height="100"
          fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

    <!-- exec note on NULLRELAY -->
    <rect x="668" y="340" width="64" height="24" rx="4"
          fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
    <text x="700" y="356" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" text-anchor="middle">exec cmd</text>

    <!-- ══ ACTOR BOXES (drawn last) ══ -->

    <!-- OPÉRATEUR: cx=100, x=28, w=144 -->
    <rect x="28" y="60" width="144" height="52" rx="6" fill="#f5f5f5"/>
    <rect x="28" y="60" width="144" height="52" rx="6"
          fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <rect x="36" y="68" width="36" height="12" rx="2"
          fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
    <text x="54" y="77" fill="rgba(122,131,153,0.80)" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.08em">USER</text>
    <text x="100" y="95" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist',sans-serif" text-anchor="middle">Opérateur</text>
    <text x="100" y="107" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono',monospace" text-anchor="middle">operator_cli.py</text>

    <!-- SERVER.PY (focal): cx=280, x=208, w=144 -->
    <rect x="208" y="60" width="144" height="52" rx="6" fill="#f5f5f5"/>
    <rect x="208" y="60" width="144" height="52" rx="6"
          fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="216" y="68" width="32" height="12" rx="2"
          fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
    <text x="232" y="77" fill="rgba(235,108,54,0.80)" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.08em">SRV</text>
    <text x="280" y="95" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist',sans-serif" text-anchor="middle">server.py</text>
    <text x="280" y="107" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono',monospace" text-anchor="middle">local:1337</text>

    <!-- WORKER.JS (cloud/external): cx=460, x=388, w=144 -->
    <rect x="388" y="60" width="144" height="52" rx="6" fill="#f5f5f5"/>
    <rect x="388" y="60" width="144" height="52" rx="6"
          fill="rgba(46,90,168,0.04)" stroke="rgba(46,90,168,0.50)"
          stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="396" y="68" width="44" height="12" rx="2"
          fill="transparent" stroke="rgba(46,90,168,0.40)" stroke-width="0.8"/>
    <text x="418" y="77" fill="rgba(46,90,168,0.80)" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.08em">CLOUD</text>
    <text x="460" y="95" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist',sans-serif" text-anchor="middle">worker.js</text>
    <text x="460" y="107" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono',monospace" text-anchor="middle">Cloudflare KV</text>

    <!-- NULLRELAY (agent/external): cx=660, x=588, w=144 -->
    <rect x="588" y="60" width="144" height="52" rx="6" fill="#f5f5f5"/>
    <rect x="588" y="60" width="144" height="52" rx="6"
          fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="596" y="68" width="44" height="12" rx="2"
          fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
    <text x="618" y="77" fill="rgba(45,49,66,0.60)" font-size="7"
          font-family="'Geist Mono',monospace" text-anchor="middle"
          letter-spacing="0.08em">AGENT</text>
    <text x="660" y="95" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist',sans-serif" text-anchor="middle">NullRelay</text>
    <text x="660" y="107" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono',monospace" text-anchor="middle">nullrelay.py</text>

    <!-- ══ LEGEND ══ -->
    <line x1="28" y1="558" x2="732" y2="558"
          stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

    <!-- sync call -->
    <line x1="48" y1="578" x2="72" y2="578"
          stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-arr)"/>
    <text x="80" y="582" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">SYNC</text>

    <!-- https/api link -->
    <line x1="152" y1="578" x2="176" y2="578"
          stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#cf-arr-lnk)"/>
    <text x="184" y="582" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">HTTPS / API</text>

    <!-- async poll -->
    <line x1="308" y1="578" x2="332" y2="578"
          stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"
          marker-end="url(#cf-arr-open)"/>
    <text x="340" y="582" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">ASYNC / POLL</text>

    <!-- résultat accent -->
    <line x1="488" y1="578" x2="512" y2="578"
          stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3"
          marker-end="url(#cf-arr-acc)"/>
    <text x="520" y="582" fill="#7a8399" font-size="8"
          font-family="'Geist Mono',monospace" letter-spacing="0.08em">RÉSULTAT</text>
  </svg>
</div>
</body>
</html>
